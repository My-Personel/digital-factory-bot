name: Daily Short
on:
  schedule:
    - cron: "30 11 * * *"      # roz 5:00 PM IST (UTC 11:30)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fonts-noto-ui-core
      - run: pip install -r requirements.txt
      - name: Make + upload
        env:
          GEMINI_API_KEY:   ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY:   ${{ secrets.PEXELS_API_KEY }}
          YT_CLIENT_ID:     ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_PRIVACY:       ${{ vars.YT_PRIVACY || 'private' }}
        run: python run.py --upload
      - name: Save topic queue
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add topics.txt done.txt && git commit -m "topic used" || true
          git push || true
      - uses: actions/upload-artifact@v4
        with: { name: video, path: out/*.mp4, retention-days: 7 }
